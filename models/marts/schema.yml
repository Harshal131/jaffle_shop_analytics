version: 2

models:
  - name: dim_customers
    description: "Dimension table containing descriptive customer attributes."
    columns:
      - name: customer_id
        description: "Primary key for the customer dimension."
        data_tests:
          - not_null
          - unique
      - name: first_name
        description: "Customer first name."
      - name: last_name
        description: "Customer last name."

  - name: fact_orders
    description: "Fact table containing one row per order."
    columns:
      - name: order_id
        description: "Primary key for the order."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Foreign key to the customer dimension."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Date the order was placed."
      - name: status
        description: "Lifecycle status of the order."