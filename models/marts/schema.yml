version: 2

models:
  - name: customers_orders
    description: "Business-facing mart combining customers with their orders."
    columns:
      - name: customer_id
        description: "Identifier of the customer linked to the order."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: first_name
        description: "Customer first name."
      - name: last_name
        description: "Customer last name."
      - name: order_id
        description: "Identifier of the order."
      - name: order_date
        description: "Date the order was placed."
      - name: status
        description: "Lifecycle status of the order."